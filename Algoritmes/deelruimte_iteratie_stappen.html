<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deelruimte Iteratie Stappen</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 20px 48px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
  </style>
</head>
<body>

<style>
.step-dot { width:10px;height:10px;border-radius:50%;background:#c0c4cc;display:inline-block;transition:background 0.3s; }
.step-dot.active { background:var(--color-text-info); }
.mat { display:inline-grid; gap:3px; vertical-align:middle; }
.mc { width:62px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:12px;font-family:"Menlo", "Monaco", "Courier New", monospace;color:#111111;background:#f8f9fb;border:0.5px solid #e2e5ec;transition:background 0.4s,color 0.4s; }
.mc.hi { background:var(--color-background-info);color:var(--color-text-info); }
.mc.hi2 { background:#fef5e7;color:var(--color-text-warning); }
.mc.hi3 { background:#eefaf3;color:#166534; }
.lbl { font-size:13px;color:#6b7280;margin-bottom:6px; }
.mat-wrap { display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;margin:12px 0; }
.nav-btn { padding:8px 18px;border-radius:6px;border:0.5px solid #c0c4cc;background:transparent;color:#111111;cursor:pointer;font-size:13px; }
.nav-btn:hover { background:#f8f9fb; }
.nav-btn:disabled { opacity:0.35;cursor:default; }
.formula-box { background:#f8f9fb;border-radius:6px;padding:10px 14px;font-size:13px;font-family:"Menlo", "Monaco", "Courier New", monospace;color:#111111;margin:10px 0;border:0.5px solid #e2e5ec; }
.explain { font-size:13px;color:#6b7280;line-height:1.6;margin:8px 0; }
</style>

<h2 class="sr-only">Deelruimte-iteratie stap voor stap: zoek top-2 eigenvectoren van een 4x4 matrix</h2>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
  <div style="font-size:14px;font-weight:500;color:#111111;" id="step-title">Stap 0: beginpunt</div>
  <div style="display:flex;gap:6px;align-items:center;" id="dots"></div>
</div>

<div id="content"></div>

<div style="display:flex;gap:10px;margin-top:16px;">
  <button class="nav-btn" id="prev-btn" onclick="go(-1)" disabled>Vorige</button>
  <button class="nav-btn" id="next-btn" onclick="go(1)">Volgende</button>
</div>

<script>
function r(v,d=3){return parseFloat(v.toFixed(d));}
function fmtN(v){return r(v,3).toFixed(3);}

const A=[[4,1,0,0],[1,3,1,0],[0,1,2,1],[0,0,1,1]];
const Q0=[[1,0],[0,1],[0,0],[0,0]];

function matMul(A,B){
  const m=A.length,n=B[0].length,k=B.length;
  return Array.from({length:m},(_,i)=>Array.from({length:n},(_,j)=>A[i].reduce((s,_,l)=>s+A[i][l]*B[l][j],0)));
}
function gramSchmidt(P){
  const m=P.length,n=P[0].length;
  const Q=Array.from({length:m},()=>Array(n).fill(0));
  for(let j=0;j<n;j++){
    let v=P.map(r=>r[j]);
    for(let i=0;i<j;i++){
      const qi=Q.map(r=>r[i]);
      const dot=v.reduce((s,x,k)=>s+x*qi[k],0);
      v=v.map((x,k)=>x-dot*qi[k]);
    }
    const norm=Math.sqrt(v.reduce((s,x)=>s+x*x,0));
    for(let k=0;k<m;k++) Q[k][j]=v[k]/norm;
  }
  return Q;
}

const P1=matMul(A,Q0);
const Q1=gramSchmidt(P1);
const P2=matMul(A,Q1);
const Q2=gramSchmidt(P2);
const P3=matMul(A,Q2);
const Q3=gramSchmidt(P3);

function matHTML(M,cols,hiRows,cls){
  const n=M.length,c=M[0].length;
  let h=`<div class="mat" style="grid-template-columns:repeat(${c},1fr)">`;
  for(let i=0;i<n;i++) for(let j=0;j<c;j++){
    const hiClass=(hiRows&&hiRows.includes(j))?` ${cls||'hi'}`:'';
    h+=`<div class="mc${hiClass}">${fmtN(M[i][j])}</div>`;
  }
  return h+'</div>';
}

const steps=[
  {
    title:'Stap 0: beginpunt',
    html:`
      <p class="explain">We zoeken de <span style="color:var(--color-text-info)">top-2 eigenvectoren</span> van A. We starten met Q₀: twee willekeurige orthonormale kolommen (hier de eerste twee standaardbasisvectoren).</p>
      <div class="mat-wrap">
        <div>
          <div class="lbl">Matrix A (4×4)</div>
          ${matHTML(A)}
        </div>
        <div>
          <div class="lbl">Q₀ (4×2) — startpunt</div>
          ${matHTML(Q0,[],[0,1],'hi')}
        </div>
      </div>
      <div class="formula-box">Q₀ heeft orthonormale kolommen: Q₀ᵀQ₀ = I</div>
      <p class="explain">De twee kolommen van Q₀ spannen een 2D-deelruimte op. Na elke iteratie zal deze deelruimte dichter bij de ruimte van de twee grootste eigenvectoren komen.</p>
    `
  },
  {
    title:'Iteratie 1 — Stap A: bereken P₁ = A·Q₀',
    html:`
      <p class="explain">We vermenigvuldigen A met Q₀. Dit "trekt" de kolommen richting de dominante eigenvectoren, maar ze zijn niet meer orthonormaal.</p>
      <div class="formula-box">P₁ = A · Q₀</div>
      <div class="mat-wrap">
        <div><div class="lbl">A</div>${matHTML(A)}</div>
        <div style="font-size:20px;align-self:center;color:#6b7280">·</div>
        <div><div class="lbl">Q₀</div>${matHTML(Q0)}</div>
        <div style="font-size:20px;align-self:center;color:#6b7280">=</div>
        <div><div class="lbl">P₁ (nog niet orthonormaal)</div>${matHTML(P1,[],[0,1],'hi2')}</div>
      </div>
      <p class="explain">Merk op: de kolommen van P₁ zijn niet meer loodrecht op elkaar en niet meer van lengte 1. Dat herstellen we in de volgende stap met QR-factorisatie.</p>
    `
  },
  {
    title:'Iteratie 1 — Stap B: QR-factorisatie → Q₁',
    html:`
      <p class="explain">We passen Gram-Schmidt toe op de kolommen van P₁ om Q₁ te krijgen: orthonormale kolommen die dezelfde deelruimte opspannen als P₁.</p>
      <div class="formula-box">P₁ = Q₁ · R₁  →  bewaar Q₁, gooi R₁ weg</div>
      <div class="mat-wrap">
        <div><div class="lbl">P₁</div>${matHTML(P1,[],[0,1],'hi2')}</div>
        <div style="font-size:20px;align-self:center;color:#6b7280">→ QR →</div>
        <div><div class="lbl">Q₁ (orthonormaal)</div>${matHTML(Q1,[],[0,1],'hi3')}</div>
      </div>
      <p class="explain">Verificatie: Q₁ᵀQ₁ ≈ I  (kolommen zijn loodrecht, lengte 1). De deelruimte is nu beter uitgelijnd met de twee dominante eigenvectoren dan Q₀ was.</p>
    `
  },
  {
    title:'Iteratie 2 — P₂ = A·Q₁ en QR → Q₂',
    html:`
      <p class="explain">We herhalen exact dezelfde twee stappen met Q₁ als nieuw startpunt.</p>
      <div class="formula-box">P₂ = A · Q₁  →  Q₂R₂ = P₂  →  bewaar Q₂</div>
      <div class="mat-wrap">
        <div><div class="lbl">Q₁</div>${matHTML(Q1,[],[0,1],'hi3')}</div>
        <div style="font-size:20px;align-self:center;color:#6b7280">→ A· →</div>
        <div><div class="lbl">P₂</div>${matHTML(P2,[],[0,1],'hi2')}</div>
        <div style="font-size:20px;align-self:center;color:#6b7280">→ QR →</div>
        <div><div class="lbl">Q₂</div>${matHTML(Q2,[],[0,1],'hi3')}</div>
      </div>
      <p class="explain">Q₂ is al veel dichter bij de echte eigenvectoren dan Q₁. Elke iteratie versterkt de component langs de grootste eigenwaarden.</p>
    `
  },
  {
    title:'Iteratie 3 — P₃ = A·Q₂ en QR → Q₃',
    html:`
      <p class="explain">Nog één iteratie — de kolommen convergeren snel.</p>
      <div class="formula-box">P₃ = A · Q₂  →  Q₃R₃ = P₃  →  bewaar Q₃</div>
      <div class="mat-wrap">
        <div><div class="lbl">Q₂</div>${matHTML(Q2,[],[0,1],'hi3')}</div>
        <div style="font-size:20px;align-self:center;color:#6b7280">→ A· →</div>
        <div><div class="lbl">P₃</div>${matHTML(P3,[],[0,1],'hi2')}</div>
        <div style="font-size:20px;align-self:center;color:#6b7280">→ QR →</div>
        <div><div class="lbl">Q₃</div>${matHTML(Q3,[],[0,1],'hi3')}</div>
      </div>
      <p class="explain">Na 3 iteraties zijn de kolommen van Q₃ al goede benaderingen van de twee dominante eigenvectoren van A.</p>
    `
  },
  {
    title:'Eindresultaat: eigenwaarden aflezen',
    html:`
      <p class="explain">Zodra Q_k geconvergeerd is, lezen we de eigenwaarden af via de <strong>Rayleigh-quotiënten</strong>: de diagonaal van Q_kᵀ A Q_k.</p>
      <div class="formula-box">Lambda ≈ diag(Q₃ᵀ · A · Q₃)</div>
      ${(()=>{
        const Qt=Q3[0].map((_,j)=>Q3.map(r=>r[j]));
        const QtA=matMul(Qt,A);
        const QtAQ=matMul(QtA,Q3);
        return `
        <div class="mat-wrap">
          <div><div class="lbl">Q₃ᵀ A Q₃ (2×2)</div>${matHTML(QtAQ,[],[0,1],'hi')}</div>
          <div style="align-self:center;">
            <div class="lbl">Eigenwaarden (diagonaal)</div>
            <div class="formula-box">λ₁ ≈ ${fmtN(QtAQ[0][0])}</div>
            <div class="formula-box">λ₂ ≈ ${fmtN(QtAQ[1][1])}</div>
          </div>
        </div>
        <p class="explain">De ware eigenwaarden van A zijn ≈ 4.73 en 3.27. Na slechts 3 iteraties zitten we er al dicht bij — met meer iteraties convergeert dit exact.</p>`;
      })()}
    `
  }
];

let cur=0;
function render(){
  document.getElementById('step-title').textContent=steps[cur].title;
  document.getElementById('content').innerHTML=steps[cur].html;
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').disabled=cur===steps.length-1;
  document.getElementById('next-btn').textContent=cur===steps.length-1?'Klaar':'Volgende';
  const dots=document.getElementById('dots');
  dots.innerHTML=steps.map((_,i)=>`<span class="step-dot${i===cur?' active':''}"></span>`).join('');
}
function go(d){cur=Math.max(0,Math.min(steps.length-1,cur+d));render();}
render();
</script>

</body>
</html>
