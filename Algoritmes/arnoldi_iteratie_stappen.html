<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arnoldi Iteratie Stappen</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 20px 48px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
  </style>
</head>
<body>

<style>
.sdot{width:10px;height:10px;border-radius:50%;background:#c0c4cc;display:inline-block;transition:background .3s}
.sdot.on{background:var(--color-text-info)}
.mc{width:56px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:11px;font-family:"Menlo", "Monaco", "Courier New", monospace;color:#111111;background:#f8f9fb;border:0.5px solid #e2e5ec;transition:background .4s,color .4s}
.mc.hi{background:var(--color-background-info);color:var(--color-text-info)}
.mc.hi2{background:#fef5e7;color:var(--color-text-warning)}
.mc.hi3{background:#eefaf3;color:#166534}
.mc.zero{opacity:.35}
.mat{display:inline-grid;gap:3px;vertical-align:middle}
.lbl{font-size:12px;color:#6b7280;margin-bottom:5px}
.mwrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;margin:10px 0}
.fbox{background:#f8f9fb;border-radius:6px;padding:8px 12px;font-size:12px;font-family:"Menlo", "Monaco", "Courier New", monospace;color:#111111;margin:8px 0;border:0.5px solid #e2e5ec}
.exp{font-size:13px;color:#6b7280;line-height:1.6;margin:6px 0}
.nbtn{padding:8px 16px;border-radius:6px;border:0.5px solid #c0c4cc;background:transparent;color:#111111;cursor:pointer;font-size:13px}
.nbtn:hover{background:#f8f9fb}
.nbtn:disabled{opacity:.35;cursor:default}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-right:4px;margin-bottom:4px}
.tag-p{background:var(--color-background-info);color:var(--color-text-info)}
.tag-a{background:#fef5e7;color:var(--color-text-warning)}
.tag-h{background:#eefaf3;color:#166534}
</style>

<h2 class="sr-only">Arnoldi-iteratie stap voor stap: bouw de Krylov-deelruimte en Hessenberg-matrix op</h2>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
  <div style="font-size:14px;font-weight:500;color:#111111" id="stitle">Stap 0: beginpunt</div>
  <div style="display:flex;gap:5px" id="dots"></div>
</div>

<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
  <span class="tag tag-p">Blauw = Q-kolommen (Krylov-basis)</span>
  <span class="tag tag-a">Oranje = w (tussenresultaat)</span>
  <span class="tag tag-h">Groen = H (Hessenberg-matrix)</span>
</div>

<div id="content"></div>

<div style="display:flex;gap:8px;margin-top:14px">
  <button class="nbtn" id="pb" onclick="go(-1)" disabled>Vorige</button>
  <button class="nbtn" id="nb" onclick="go(1)">Volgende</button>
</div>

<script>
const A=[[3,1,0,0],[1,4,2,0],[0,2,3,1],[0,0,1,2]];
const n=4;
function dot(a,b){return a.reduce((s,x,i)=>s+x*b[i],0)}
function norm(v){return Math.sqrt(dot(v,v))}
function scale(v,s){return v.map(x=>x*s)}
function sub(a,b){return a.map((x,i)=>x-b[i])}
function matvec(M,v){return M.map(r=>dot(r,v))}
function fmt(x){return x.toFixed(3)}

const q0=[1,0,0,0];
const nq0=norm(q0);
const Q=[];
Q.push(scale(q0,1/nq0));
const H=Array.from({length:4},()=>Array(4).fill(0));

function arnoldiStep(j){
  let w=matvec(A,Q[j]);
  const hcol=[];
  for(let i=0;i<=j;i++){
    const h=dot(w,Q[i]);
    hcol.push(h);
    H[i][j]=h;
    w=sub(w,scale(Q[i],h));
  }
  const hn=norm(w);
  H[j+1]&&(H[j+1][j]=hn);
  if(hn>1e-12) Q.push(scale(w,1/hn));
  return {w,hcol,hn};
}

const steps_data=[];
steps_data.push({w:null,hcol:null,hn:null,j:-1});
for(let j=0;j<3;j++){
  const r=arnoldiStep(j);
  steps_data.push({...r,j});
}

function matH(M,rows,cols,hiCols,cls){
  let h=`<div class="mat" style="grid-template-columns:repeat(${cols},1fr)">`;
  for(let i=0;i<rows;i++) for(let j=0;j<cols;j++){
    const v=M[i][j];
    const isHi=hiCols!=null&&hiCols.includes(j)&&i<=j+1;
    const isZero=Math.abs(v)<1e-10&&!(isHi);
    h+=`<div class="mc${isHi?` ${cls||'hi3'}`:''} ${isZero?'zero':''}">${fmt(v)}</div>`;
  }
  return h+'</div>';
}
function matQ(Qarr,hiCol){
  const m=4,nc=Qarr.length;
  let h=`<div class="mat" style="grid-template-columns:repeat(${nc},1fr)">`;
  for(let i=0;i<m;i++) for(let j=0;j<nc;j++){
    h+=`<div class="mc${j===hiCol?' hi':''}">${fmt(Qarr[j][i])}</div>`;
  }
  return h+'</div>';
}
function vecHTML(v,cls){
  return `<div class="mat" style="grid-template-columns:1fr">${v.map(x=>`<div class="mc ${cls}">${fmt(x)}</div>`).join('')}</div>`;
}

const stepDefs=[
  {
    title:'Stap 0: beginpunt',
    html(){
      return `
      <p class="exp">Arnoldi bouwt stap voor stap een orthonormale basis voor de <em>Krylov-deelruimte</em> K(A,q₁) = span{q₁, Aq₁, A²q₁, …}. We starten met één vector q₁.</p>
      <div class="mwrap">
        <div><div class="lbl">Matrix A (4×4)</div>${matH(A,4,4,null,'hi')}</div>
        <div><div class="lbl">Startvector q₁ (genormaliseerd)</div>${vecHTML(Q[0],'hi')}</div>
      </div>
      <div class="fbox">q₁ = [1, 0, 0, 0]ᵀ   (genormaliseerd: ||q₁|| = 1)</div>
      <p class="exp">Het verschil met deelruimte-iteratie: Arnoldi werkt met <em>één vector</em> en bouwt de basis op één kolom per keer. Bovendien onthoudt het alle tussenproducten in de Hessenberg-matrix H.</p>`
    }
  },
  {
    title:'Iteratie j=1: bereken w = A·q₁, orthogonaliseer',
    html(){
      const d=steps_data[1];
      const wraw=matvec(A,Q[0]);
      return `
      <p class="exp">Vermenigvuldig A met q₁, trek daarna de projectie op alle bestaande q-vectoren eraf (Gram-Schmidt), en normaliseer.</p>
      <div class="fbox">w = A·q₁  →  h₁₁ = qᵀ₁·w  →  w ← w − h₁₁·q₁  →  h₂₁ = ||w||  →  q₂ = w/h₂₁</div>
      <div class="mwrap">
        <div><div class="lbl">A·q₁ (ruw)</div>${vecHTML(wraw,'hi2')}</div>
        <div><div class="lbl">Na aftrekken projectie</div>${vecHTML(d.w,'hi2')}</div>
        <div><div class="lbl">Q tot nu (q₁, q₂)</div>${matQ(Q.slice(0,2),1)}</div>
        <div>
          <div class="lbl">H tot nu</div>
          ${matH(H,3,1,[0],'hi3')}
          <div class="exp" style="margin-top:6px">h₁₁ = ${fmt(H[0][0])}<br>h₂₁ = ${fmt(H[1][0])} (= ||w||)</div>
        </div>
      </div>
      <p class="exp">h₁₁ is de projectie van Aq₁ op q₁. h₂₁ is de norm van de rest — dit wordt de subdiagonaal van H. q₂ is de genormaliseerde rest.</p>`
    }
  },
  {
    title:'Iteratie j=2: w = A·q₂, orthogonaliseer t.o.v. q₁ én q₂',
    html(){
      const d=steps_data[2];
      const wraw=matvec(A,Q[1]);
      return `
      <p class="exp">Nu trekken we de projectie af op <em>beide</em> vorige vectoren q₁ en q₂. Dat is het sleutelkenmerk van Arnoldi: elk nieuw projectiegetal belandt in H.</p>
      <div class="fbox">w = A·q₂  →  h₁₂ = qᵀ₁·w,  h₂₂ = qᵀ₂·w  →  w ← w − h₁₂q₁ − h₂₂q₂  →  h₃₂ = ||w||  →  q₃ = w/h₃₂</div>
      <div class="mwrap">
        <div><div class="lbl">A·q₂ (ruw)</div>${vecHTML(wraw,'hi2')}</div>
        <div><div class="lbl">Na aftrekken projecties</div>${vecHTML(d.w,'hi2')}</div>
        <div><div class="lbl">Q tot nu (q₁..q₃)</div>${matQ(Q.slice(0,3),2)}</div>
        <div>
          <div class="lbl">H tot nu</div>
          ${matH(H,4,2,[1],'hi3')}
          <div class="exp" style="margin-top:6px">h₁₂=${fmt(H[0][1])}, h₂₂=${fmt(H[1][1])}<br>h₃₂=${fmt(H[2][1])} (subdiag)</div>
        </div>
      </div>
      <p class="exp">De matrix H wordt een bovenste Hessenberg-matrix: alleen de subdiagonaal heeft waarden onder de diagonaal. Dit is veel compacter dan een volle matrix.</p>`
    }
  },
  {
    title:'Iteratie j=3: w = A·q₃, orthogonaliseer t.o.v. q₁, q₂, q₃',
    html(){
      const d=steps_data[3];
      const wraw=matvec(A,Q[2]);
      return `
      <p class="exp">Zelfde patroon: projecteer op alle drie vorige vectoren, trek af, normaliseer.</p>
      <div class="fbox">w = A·q₃  →  h₁₃, h₂₃, h₃₃  →  w ← w − Σ hᵢ₃qᵢ  →  h₄₃ = ||w||  →  q₄ = w/h₄₃</div>
      <div class="mwrap">
        <div><div class="lbl">A·q₃ (ruw)</div>${vecHTML(wraw,'hi2')}</div>
        <div><div class="lbl">Na aftrekken projecties</div>${vecHTML(d.w,'hi2')}</div>
        <div><div class="lbl">Q (q₁..q₄)</div>${matQ(Q.slice(0,4),3)}</div>
        <div>
          <div class="lbl">H volledig (4×3)</div>
          ${matH(H,4,3,[2],'hi3')}
        </div>
      </div>
      <p class="exp">Na 3 stappen hebben we een volledige orthonormale basis Q van 4 vectoren én een Hessenberg-matrix H van 4×3. De relatie AQ = QH + restterm geldt exact.</p>`
    }
  },
  {
    title:'Eindresultaat: eigenwaarden via kleine matrix H',
    html(){
      const Hsm=[[H[0][0],H[0][1],H[0][2]],[H[1][0],H[1][1],H[1][2]],[H[2][1],H[2][2]]];
      const H3=[[H[0][0],H[0][1],H[0][2]],[H[1][0],H[1][1],H[1][2]],[0,H[2][1],H[2][2]]];
      return `
      <p class="exp">De slimheid van Arnoldi: de eigenwaarden van de kleine Hessenberg-matrix H (k×k) benaderen de grootste eigenwaarden van de grote matrix A (n×n).</p>
      <div class="fbox">A ≈ Q · H · Qᵀ   →   eigenwaarden(A) ≈ eigenwaarden(H)</div>
      <div class="mwrap">
        <div>
          <div class="lbl">Hessenberg H (3×3 kern)</div>
          <div class="mat" style="grid-template-columns:repeat(3,1fr);gap:3px">
            ${H3.map((row,i)=>row.map((v,j)=>`<div class="mc hi3">${fmt(v)}</div>`).join('')).join('')}
          </div>
        </div>
        <div style="align-self:center">
          <div class="lbl">Ritz-waarden (benaderde eigenwaarden)</div>
          <div class="fbox">Los QR op voor H → Ritz-waarden</div>
          <div class="fbox">Echte eigenwaarden A: ≈ 5.73, 4.41, 2.27, 0.59</div>
          <p class="exp" style="margin-top:8px">H is veel kleiner dan A — QR daarop is goedkoop. Met meer Arnoldi-stappen convergeren de Ritz-waarden naar de exacte eigenwaarden.</p>
        </div>
      </div>
      <div style="margin-top:12px;padding:10px 14px;border-radius:6px;border:0.5px solid #e2e5ec;background:#f8f9fb">
        <div style="font-size:12px;font-weight:500;color:#111111;margin-bottom:6px">Arnoldi vs deelruimte-iteratie</div>
        <div style="font-size:12px;color:#6b7280;line-height:1.7">
          Deelruimte-iter.: n vectoren tegelijk, QR per stap, herbegin nodig.<br>
          Arnoldi: 1 vector per stap, bouwt H op, <em>onthoudt alle projecties</em> — efficiënter voor niet-symmetrische matrices.
        </div>
      </div>`
    }
  }
];

let cur=0;
function render(){
  document.getElementById('stitle').textContent=stepDefs[cur].title;
  document.getElementById('content').innerHTML=stepDefs[cur].html();
  document.getElementById('pb').disabled=cur===0;
  document.getElementById('nb').disabled=cur===stepDefs.length-1;
  document.getElementById('nb').textContent=cur===stepDefs.length-1?'Klaar':'Volgende';
  document.getElementById('dots').innerHTML=stepDefs.map((_,i)=>`<span class="sdot${i===cur?' on':''}"></span>`).join('');
}
function go(d){cur=Math.max(0,Math.min(stepDefs.length-1,cur+d));render();}
render();
</script>

</body>
</html>
